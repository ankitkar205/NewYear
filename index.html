<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026: The Future</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-purple: #bd00ff;
            --bg-dark: #050510;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }

        body {
            background-color: var(--bg-dark);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px; /* 3D Depth */
        }

        /* --- BACKGROUND LAYERS --- */
        
        /* 1. Deep Space Gradient */
        .bg-gradient {
            position: absolute;
            width: 100%; height: 100%;
            background: radial-gradient(circle at center 30%, #1a1a2e 0%, #000000 80%);
            z-index: -10;
        }

        /* 2. Ambient Nebulas (Moving Blobs) */
        .nebula {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: floatNebula 10s infinite ease-in-out;
            z-index: -9;
        }
        .n1 { width: 400px; height: 400px; background: var(--neon-purple); top: -100px; left: -100px; animation-delay: 0s; }
        .n2 { width: 500px; height: 500px; background: var(--neon-cyan); bottom: -100px; right: -100px; animation-delay: -5s; }

        @keyframes floatNebula {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 50px); }
        }

        /* 3. The Digital Grid Floor */
        .grid-floor {
            position: absolute;
            bottom: -50%;
            left: -50%;
            width: 200%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.2) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: rotateX(70deg);
            animation: gridScroll 4s linear infinite;
            mask-image: linear-gradient(to top, black 20%, transparent 80%);
            z-index: -5;
        }

        .grid-floor.warp { animation-duration: 0.2s; filter: drop-shadow(0 0 10px var(--neon-cyan)); }

        @keyframes gridScroll {
            0% { transform: rotateX(70deg) translateY(0); }
            100% { transform: rotateX(70deg) translateY(50px); }
        }

        /* 4. Glowing Horizon Line */
        .horizon {
            position: absolute;
            top: 50%; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
            box-shadow: 0 0 20px var(--neon-cyan);
            opacity: 0.5;
            z-index: -4;
        }

        /* Canvas handles Stars + Fireworks */
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }


        /* --- UI & CARD --- */
        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 100;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: opacity 0.5s;
        }

        .start-btn {
            padding: 15px 40px; font-size: 1.2rem;
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-cyan); background: transparent;
            border: 2px solid var(--neon-cyan); border-radius: 5px;
            text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 0 15px var(--neon-cyan);
            cursor: pointer;
        }

        .scene { position: relative; transform-style: preserve-3d; z-index: 10; }

        .card {
            position: relative;
            width: 320px;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            text-align: center;
            transform-style: preserve-3d;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            transition: transform 0.1s ease-out;
        }

        .card.shaking { animation: shake 0.1s infinite; }
        @keyframes shake { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(1deg); } 75% { transform: rotate(-1deg); } }

        .header-text { color: var(--neon-purple); letter-spacing: 4px; font-size: 0.9rem; margin-bottom: 20px; text-transform: uppercase; font-family: 'Rajdhani', sans-serif; font-weight: 700; transform: translateZ(30px); }
        
        .year-text { font-size: 5rem; font-weight: 900; color: #fff; line-height: 1; transform: translateZ(60px); text-shadow: 0 0 20px var(--neon-cyan); margin-bottom: 10px; }
        
        .instruction {
            margin-top: 30px; font-size: 0.7rem; color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan); padding: 8px 12px;
            display: inline-block; border-radius: 20px;
            transform: translateZ(40px); background: rgba(0, 243, 255, 0.1);
            text-transform: uppercase; letter-spacing: 1px;
        }

        /* REACTOR */
        .holo-container { position: relative; width: 100px; height: 100px; margin: 0 auto 20px auto; transform-style: preserve-3d; transform: translateZ(50px); }
        .ring { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 2px solid transparent; border-radius: 50%; box-shadow: 0 0 10px var(--neon-cyan); }
        .r1 { border-top: 3px solid var(--neon-cyan); border-bottom: 3px solid var(--neon-cyan); animation: spin1 4s linear infinite; }
        .r2 { width: 80%; height: 80%; top: 10%; left: 10%; border-left: 3px solid var(--neon-pink); border-right: 3px solid var(--neon-pink); animation: spin2 3s linear infinite; }
        .core { position: absolute; top: 35%; left: 35%; width: 30%; height: 30%; background: #fff; border-radius: 50%; box-shadow: 0 0 20px #fff, 0 0 40px var(--neon-cyan); animation: pulse 1s ease-in-out infinite alternate; }
        .holo-container.overload .r1, .holo-container.overload .r2 { animation-duration: 0.1s; border-color: #fff; }

        @keyframes spin1 { 0% { transform: rotateX(0) rotateY(0); } 100% { transform: rotateX(360deg) rotateY(180deg); } }
        @keyframes spin2 { 0% { transform: rotateX(0) rotateY(0); } 100% { transform: rotateX(-180deg) rotateY(360deg); } }
        @keyframes pulse { 0% { transform: scale(0.9); opacity: 0.8; } 100% { transform: scale(1.1); opacity: 1; } }

    </style>
</head>
<body>

    <!-- LAYERS -->
    <div class="bg-gradient"></div>
    <div class="nebula n1"></div>
    <div class="nebula n2"></div>
    
    <!-- Moving Grid Floor -->
    <div class="grid-floor" id="grid"></div>
    <div class="horizon"></div>

    <canvas id="mainCanvas"></canvas>

    <div id="start-overlay">
        <button class="start-btn" onclick="initExperience()">Initialize System</button>
        <p style="color:white; margin-top:15px; font-size:0.8rem; opacity:0.6;">Tap to enable Gyro & Audio</p>
    </div>

    <div class="scene">
        <div class="card" id="tiltCard">
            <div class="header-text">Happy New Year</div>
            
            <div class="holo-container" id="reactor">
                <div class="ring r1"></div>
                <div class="ring r2"></div>
                <div class="core"></div>
            </div>

            <div class="year-text">2026</div>
            <div class="instruction">Hold for Warp Speed</div>
        </div>
    </div>

    <script>
        const card = document.getElementById('tiltCard');
        const overlay = document.getElementById('start-overlay');
        const grid = document.getElementById('grid');
        const reactor = document.getElementById('reactor');
        let isWarping = false;
        
        // --- GYRO INIT ---
        function initExperience() {
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 500);
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(state => { if (state === 'granted') window.addEventListener('deviceorientation', handleOrientation); })
                    .catch(console.error);
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        function handleOrientation(event) {
            if (isWarping) return;
            let tiltX = event.gamma; let tiltY = event.beta;
            if (tiltY) tiltY -= 45; // Calibration
            // Clamp
            if (tiltX > 30) tiltX = 30; if (tiltX < -30) tiltX = -30;
            if (tiltY > 30) tiltY = 30; if (tiltY < -30) tiltY = -30;
            card.style.transform = `rotateY(${tiltX}deg) rotateX(${-tiltY}deg)`;
        }

        document.addEventListener('mousemove', (e) => {
            if (isWarping) return;
            const x = (window.innerWidth / 2 - e.pageX) / 25;
            const y = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
        });

        // --- WARP INTERACTION ---
        function startWarp() {
            isWarping = true;
            grid.classList.add('warp');
            card.classList.add('shaking');
            reactor.classList.add('overload');
            card.style.transform = `scale(0.95)`;
            document.querySelector('.instruction').innerText = "HYPERSPEED ENGAGED";
            document.querySelector('.instruction').style.background = "#ff00ff";
            document.querySelector('.instruction').style.color = "white";
        }

        function endWarp() {
            isWarping = false;
            grid.classList.remove('warp');
            card.classList.remove('shaking');
            reactor.classList.remove('overload');
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
            document.querySelector('.instruction').innerText = "Hold for Warp Speed";
            document.querySelector('.instruction').style.background = "rgba(0, 243, 255, 0.1)";
            document.querySelector('.instruction').style.color = "var(--neon-cyan)";
        }

        document.addEventListener('mousedown', startWarp);
        document.addEventListener('mouseup', endWarp);
        document.addEventListener('touchstart', startWarp);
        document.addEventListener('touchend', endWarp);


        // --- UNIFIED CANVAS ENGINE (STARS + FIREWORKS) ---
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let stars = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initStars();
        }
        window.addEventListener('resize', resize);
        
        // --- STAR SYSTEM ---
        function initStars() {
            stars = [];
            for(let i=0; i<200; i++) {
                stars.push({
                    x: Math.random() * width - width/2,
                    y: Math.random() * height - height/2,
                    z: Math.random() * width
                });
            }
        }

        function updateStars() {
            const cx = width / 2;
            const cy = height / 2;
            const speed = isWarping ? 40 : 2; // Warp speed multiplier

            ctx.fillStyle = "#ffffff";
            
            stars.forEach(star => {
                star.z -= speed;
                if(star.z <= 0) {
                    star.z = width;
                    star.x = Math.random() * width - width/2;
                    star.y = Math.random() * height - height/2;
                }

                const x = (star.x / star.z) * width + cx;
                const y = (star.y / star.z) * height + cy;
                const size = (1 - star.z / width) * 2;
                
                if(x > 0 && x < width && y > 0 && y < height) {
                    if(isWarping) {
                        // Draw Lines (Hyperspace)
                        const prevX = (star.x / (star.z + speed*2)) * width + cx;
                        const prevY = (star.y / (star.z + speed*2)) * height + cy;
                        ctx.beginPath();
                        ctx.moveTo(prevX, prevY);
                        ctx.lineTo(x, y);
                        ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
                        ctx.lineWidth = size;
                        ctx.stroke();
                    } else {
                        // Draw Dots
                        ctx.beginPath();
                        ctx.arc(x, y, size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            });
        }

        // --- FIREWORKS SYSTEM ---
        function createFirework() {
            const colors = ['#00f3ff', '#ff00ff', '#bd00ff', '#ffffff', '#ffd700'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const x = Math.random() * width;
            const y = Math.random() * (height * 0.6);
            
            for(let i=0; i<30; i++) {
                particles.push({
                    x: x, y: y, color: color,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    alpha: 1
                });
            }
        }

        function updateFireworks() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.vx *= 0.95; p.vy *= 0.95; p.vy += 0.15;
                p.x += p.vx; p.y += p.vy; p.alpha -= 0.02;

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        // --- MAIN LOOP ---
        function loop() {
            // Clear Canvas
            ctx.clearRect(0, 0, width, height);

            updateStars();
            updateFireworks();

            // Auto-fireworks during warp
            if(isWarping && Math.random() < 0.2) createFirework();
            // Occasional fireworks when idle
            if(!isWarping && Math.random() < 0.02) createFirework();

            requestAnimationFrame(loop);
        }

        resize();
        loop();

    </script>
</body>
</html>
