<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026: Gyro Enabled</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-purple: #bd00ff;
            --bg-dark: #020205;
            --grid-color: rgba(0, 243, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; /* Prevent scrolling */ }

        body {
            background-color: var(--bg-dark);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- OVERLAY FOR PERMISSIONS --- */
        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s;
        }

        .start-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-cyan);
            background: transparent;
            border: 2px solid var(--neon-cyan);
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 0 15px var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: pulseBtn 1.5s infinite;
        }

        @keyframes pulseBtn {
            0% { box-shadow: 0 0 15px var(--neon-cyan); }
            50% { box-shadow: 0 0 30px var(--neon-cyan), 0 0 10px #fff; }
            100% { box-shadow: 0 0 15px var(--neon-cyan); }
        }

        /* --- INFINITE GRID --- */
        .grid-plane {
            position: absolute;
            bottom: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: rotateX(70deg);
            transform-origin: 50% 50%;
            animation: gridMove 4s linear infinite;
            mask-image: radial-gradient(circle, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 70%);
            z-index: -5;
            transition: animation-duration 0.5s; 
        }

        .grid-plane.warp-speed { animation-duration: 0.2s; filter: drop-shadow(0 0 10px var(--neon-cyan)); }

        @keyframes gridMove {
            0% { transform: rotateX(70deg) translateY(0); }
            100% { transform: rotateX(70deg) translateY(50px); }
        }

        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

        /* --- 3D CARD --- */
        .scene { position: relative; transform-style: preserve-3d; z-index: 10; }

        .card {
            position: relative;
            width: 340px;
            padding: 40px 20px;
            background: rgba(15, 15, 20, 0.65);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            text-align: center;
            transform-style: preserve-3d;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 30px rgba(0, 243, 255, 0.05);
            transition: transform 0.1s cubic-bezier(0.1, 0.1, 0.1, 1);
        }

        .card.shaking { animation: shake 0.1s infinite; }
        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(1deg); }
            75% { transform: rotate(-1deg); }
        }

        .header-text {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            color: var(--neon-purple);
            letter-spacing: 5px;
            font-size: 1rem;
            transform: translateZ(30px);
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        /* REACTOR */
        .holo-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 20px auto;
            transform-style: preserve-3d;
            transform: translateZ(50px);
        }
        .ring {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border: 2px solid transparent; border-radius: 50%;
            box-shadow: 0 0 15px var(--neon-cyan);
        }
        .r1 { border-top: 3px solid var(--neon-cyan); border-bottom: 3px solid var(--neon-cyan); animation: spin1 4s linear infinite; }
        .r2 { width: 80%; height: 80%; top: 10%; left: 10%; border-left: 3px solid var(--neon-pink); border-right: 3px solid var(--neon-pink); animation: spin2 3s linear infinite; }
        .core {
            position: absolute; top: 35%; left: 35%; width: 30%; height: 30%;
            background: #fff; border-radius: 50%;
            box-shadow: 0 0 20px #fff, 0 0 40px var(--neon-cyan);
            animation: pulse 1s ease-in-out infinite alternate;
        }
        .holo-container.overload .r1, .holo-container.overload .r2 { animation-duration: 0.1s; border-color: #fff; }

        @keyframes spin1 { 0% { transform: rotateX(0) rotateY(0); } 100% { transform: rotateX(360deg) rotateY(180deg); } }
        @keyframes spin2 { 0% { transform: rotateX(0) rotateY(0); } 100% { transform: rotateX(-180deg) rotateY(360deg); } }
        @keyframes pulse { 0% { transform: scale(0.9); opacity: 0.8; } 100% { transform: scale(1.1); opacity: 1; } }

        .year-text {
            font-size: 5rem;
            font-weight: 900;
            color: #fff;
            line-height: 1;
            transform: translateZ(60px);
            text-shadow: 3px 3px var(--neon-pink), -3px -3px var(--neon-cyan);
            margin-bottom: 10px;
        }

        .instruction {
            margin-top: 30px;
            font-size: 0.7rem;
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            padding: 8px 12px;
            display: inline-block;
            border-radius: 20px;
            transform: translateZ(40px);
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(0, 243, 255, 0.1);
        }

        @media (max-width: 600px) {
            .year-text { font-size: 4.5rem; }
            .card { width: 90%; }
        }
    </style>
</head>
<body>

    <!-- OVERLAY IS REQUIRED FOR IOS GYRO PERMISSIONS -->
    <div id="start-overlay">
        <button class="start-btn" onclick="initExperience()">Initialize 2026</button>
        <p style="color:white; margin-top:20px; font-size:0.8rem; opacity:0.7;">Tap to enable Motion & Audio</p>
    </div>

    <div class="grid-plane" id="grid"></div>
    <canvas id="fireworksCanvas"></canvas>

    <div class="scene">
        <div class="card" id="tiltCard">
            <div class="header-text">System Ready</div>
            
            <div class="holo-container" id="reactor">
                <div class="ring r1"></div>
                <div class="ring r2"></div>
                <div class="core"></div>
            </div>

            <div class="year-text">2026</div>
            <div class="instruction">Hold to Warp Speed</div>
        </div>
    </div>

    <script>
        const card = document.getElementById('tiltCard');
        const overlay = document.getElementById('start-overlay');
        const grid = document.getElementById('grid');
        const reactor = document.getElementById('reactor');
        let isWarping = false;
        
        // --- 1. INITIALIZE GYROSCOPE (The Fix) ---
        function initExperience() {
            // Fade out overlay
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 500);

            // Request Gyro Permission for iOS 13+
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                        } else {
                            alert("Motion permission denied. Use touch/mouse to interact.");
                        }
                    })
                    .catch(console.error);
            } else {
                // Non-iOS or older devices usually work automatically
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        // --- 2. MOTION HANDLER ---
        function handleOrientation(event) {
            if (isWarping) return;

            // Beta: Front/Back tilt (-180 to 180)
            // Gamma: Left/Right tilt (-90 to 90)
            let tiltX = event.gamma; 
            let tiltY = event.beta;

            // Calibration: Natural holding position is usually tilted back ~45 degrees
            // We subtract 45 so "holding naturally" counts as 0
            if (tiltY) tiltY -= 45;

            // Clamp values to prevent card from flipping over completely
            if (tiltX > 30) tiltX = 30;
            if (tiltX < -30) tiltX = -30;
            if (tiltY > 30) tiltY = 30;
            if (tiltY < -30) tiltY = -30;

            // Apply rotation (inverted logic for natural feel)
            // RotateY handles Left/Right (Gamma), RotateX handles Front/Back (Beta)
            card.style.transform = `rotateY(${tiltX}deg) rotateX(${-tiltY}deg)`;
        }

        // --- 3. MOUSE FALLBACK ---
        document.addEventListener('mousemove', (e) => {
            if (isWarping) return;
            const x = (window.innerWidth / 2 - e.pageX) / 20;
            const y = (window.innerHeight / 2 - e.pageY) / 20;
            card.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
        });

        // --- 4. WARP SPEED LOGIC (Touch + Mouse) ---
        function startWarp() {
            isWarping = true;
            grid.classList.add('warp-speed');
            card.classList.add('shaking');
            reactor.classList.add('overload');
            card.style.transform = `scale(0.95)`; // Snap to center slightly
            document.querySelector('.instruction').innerText = "HYPERSPEED ENGAGED";
            document.querySelector('.instruction').style.background = "#ff00ff";
            document.querySelector('.instruction').style.color = "white";
            
            // Fast fireworks
            warpInterval = setInterval(() => {
                createFirework(
                    Math.random() * window.innerWidth, 
                    Math.random() * window.innerHeight
                );
            }, 100);
        }

        function endWarp() {
            isWarping = false;
            grid.classList.remove('warp-speed');
            card.classList.remove('shaking');
            reactor.classList.remove('overload');
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
            document.querySelector('.instruction').innerText = "Hold to Warp Speed";
            document.querySelector('.instruction').style.background = "rgba(0, 243, 255, 0.1)";
            document.querySelector('.instruction').style.color = "var(--neon-cyan)";
            clearInterval(warpInterval);
        }

        let warpInterval;
        // Mouse Events
        document.addEventListener('mousedown', startWarp);
        document.addEventListener('mouseup', endWarp);
        // Touch Events
        document.addEventListener('touchstart', (e) => { startWarp(); });
        document.addEventListener('touchend', endWarp);


        // --- 5. FIREWORKS ENGINE ---
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const colors = ['#00f3ff', '#ff00ff', '#bd00ff', '#ffffff'];

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        function createFirework(x, y) {
            const color = colors[Math.floor(Math.random() * colors.length)];
            const count = isWarping ? 15 : 30; 
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    color: color,
                    vx: (Math.random() - 0.5) * (isWarping ? 15 : 6),
                    vy: (Math.random() - 0.5) * (isWarping ? 15 : 6),
                    alpha: 1
                });
            }
        }

        function animate() {
            ctx.fillStyle = isWarping ? 'rgba(2, 2, 5, 0.3)' : 'rgba(2, 2, 5, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach((p, index) => {
                p.vx *= 0.95; p.vy *= 0.95; p.vy += 0.1;
                p.x += p.vx; p.y += p.vy; p.alpha -= 0.02;

                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, isWarping ? 2 : 3, 0, Math.PI * 2);
                ctx.fill();

                if (p.alpha <= 0) particles.splice(index, 1);
            });

            if(!isWarping && Math.random() < 0.02) {
                createFirework(Math.random()*canvas.width, Math.random()*canvas.height/2);
            }
            requestAnimationFrame(animate);
        }
        animate();

    </script>
</body>
</html>
