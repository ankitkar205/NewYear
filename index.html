<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026: The Future</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-purple: #bd00ff;
            --bg-dark: #020205;
            --grid-color: rgba(0, 243, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            user-select: none;
            cursor: crosshair;
        }

        /* --- 1. INFINITE WARP GRID --- */
        .grid-plane {
            position: absolute;
            bottom: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 60px 60px;
            transform: rotateX(75deg);
            transform-origin: 50% 50%;
            animation: gridMove 4s linear infinite;
            mask-image: radial-gradient(circle, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 70%);
            z-index: -5;
            transition: animation-duration 2s ease-in; /* Smooth acceleration */
        }

        .grid-plane.warp-speed {
            animation-duration: 0.2s; /* HYPERSPEED */
            filter: drop-shadow(0 0 10px var(--neon-cyan));
        }

        @keyframes gridMove {
            0% { transform: rotateX(75deg) translateY(0); }
            100% { transform: rotateX(75deg) translateY(60px); }
        }

        /* --- 2. CANVAS --- */
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

        /* --- 3. THE 3D CARD --- */
        .scene {
            position: relative;
            transform-style: preserve-3d;
            z-index: 10;
        }

        .card {
            position: relative;
            width: 380px;
            padding: 50px 20px;
            background: rgba(10, 10, 15, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            text-align: center;
            transform-style: preserve-3d;
            box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 20px rgba(0, 243, 255, 0.05);
            transition: transform 0.1s linear; /* For tilt */
        }

        .card.shaking {
            animation: shake 0.1s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .header-text {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            color: var(--neon-purple);
            letter-spacing: 6px;
            font-size: 1rem;
            transform: translateZ(30px);
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        /* --- 4. HOLOGRAPHIC REACTOR (Replaces Timer) --- */
        .holo-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px auto;
            transform-style: preserve-3d;
            transform: translateZ(50px);
        }

        .ring {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: 2px solid transparent;
            border-radius: 50%;
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        .r1 {
            border-top: 4px solid var(--neon-cyan);
            border-bottom: 4px solid var(--neon-cyan);
            animation: spin1 4s linear infinite;
        }

        .r2 {
            width: 80%; height: 80%;
            top: 10%; left: 10%;
            border-left: 4px solid var(--neon-pink);
            border-right: 4px solid var(--neon-pink);
            animation: spin2 3s linear infinite;
        }

        .r3 {
            width: 60%; height: 60%;
            top: 20%; left: 20%;
            border: 2px dashed #fff;
            animation: spin1 5s linear infinite reverse;
        }

        .core {
            position: absolute;
            top: 35%; left: 35%;
            width: 30%; height: 30%;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 30px #fff, 0 0 60px var(--neon-cyan);
            animation: pulse 1s ease-in-out infinite alternate;
        }

        .holo-container.overload .r1,
        .holo-container.overload .r2,
        .holo-container.overload .r3 {
            animation-duration: 0.1s; /* Spin fast on hold */
            border-color: #fff;
        }
        
        @keyframes spin1 {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            100% { transform: rotateX(360deg) rotateY(180deg); }
        }
        @keyframes spin2 {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            100% { transform: rotateX(-180deg) rotateY(360deg); }
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        /* --- 5. MAIN TEXT --- */
        .year-text {
            font-size: 5.5rem;
            font-weight: 900;
            color: #fff;
            line-height: 1;
            transform: translateZ(60px);
            text-shadow: 4px 4px var(--neon-pink), -4px -4px var(--neon-cyan);
            margin-bottom: 10px;
        }

        .sub-text {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.6);
            transform: translateZ(30px);
            letter-spacing: 2px;
            font-family: 'Rajdhani', sans-serif;
        }

        .instruction {
            margin-top: 35px;
            font-size: 0.75rem;
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            padding: 8px 15px;
            display: inline-block;
            border-radius: 20px;
            transform: translateZ(40px);
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(0, 243, 255, 0.1);
            pointer-events: none;
        }

        /* Mobile */
        @media (max-width: 600px) {
            .card { width: 90%; padding: 40px 15px; }
            .year-text { font-size: 4rem; }
        }
    </style>
</head>
<body>

    <!-- Infinite Grid -->
    <div class="grid-plane" id="grid"></div>

    <!-- Fireworks Canvas -->
    <canvas id="fireworksCanvas"></canvas>

    <div class="scene">
        <div class="card" id="tiltCard">
            <div class="header-text">System Online</div>

            <!-- The Holographic Reactor -->
            <div class="holo-container" id="reactor">
                <div class="ring r1"></div>
                <div class="ring r2"></div>
                <div class="ring r3"></div>
                <div class="core"></div>
            </div>

            <div class="year-text">2026</div>
            <div class="sub-text">THE FUTURE IS NOW</div>

            <div class="instruction">Hold Click for Warp Speed</div>
        </div>
    </div>

    <script>
        // --- 1. TILT EFFECT ---
        const card = document.getElementById('tiltCard');
        const reactor = document.getElementById('reactor');
        const grid = document.getElementById('grid');
        let isWarping = false;

        document.addEventListener('mousemove', (e) => {
            if(isWarping) return; // Disable manual tilt during warp

            const x = (window.innerWidth / 2 - e.pageX) / 25;
            const y = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
            
            // Parallax the reactor slightly opposite
            reactor.style.transform = `translateZ(50px) translateX(${-x}px) translateY(${-y}px)`;
        });

        // --- 2. WARP SPEED INTERACTION ---
        function startWarp() {
            isWarping = true;
            grid.classList.add('warp-speed');
            card.classList.add('shaking');
            reactor.classList.add('overload');
            document.querySelector('.instruction').innerText = "HYPERSPEED ENGAGED";
            document.querySelector('.instruction').style.background = "#ff00ff";
            document.querySelector('.instruction').style.color = "#fff";
            
            // Launch crazy fireworks
            warpInterval = setInterval(() => {
                createFirework(
                    Math.random() * window.innerWidth, 
                    Math.random() * window.innerHeight
                );
            }, 100);
        }

        function endWarp() {
            isWarping = false;
            grid.classList.remove('warp-speed');
            card.classList.remove('shaking');
            reactor.classList.remove('overload');
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
            document.querySelector('.instruction').innerText = "Hold Click for Warp Speed";
            document.querySelector('.instruction').style.background = "rgba(0, 243, 255, 0.1)";
            document.querySelector('.instruction').style.color = "var(--neon-cyan)";
            
            clearInterval(warpInterval);
        }

        let warpInterval;
        document.addEventListener('mousedown', startWarp);
        document.addEventListener('mouseup', endWarp);
        document.addEventListener('touchstart', startWarp);
        document.addEventListener('touchend', endWarp);

        // --- 3. FIREWORKS ENGINE ---
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const velocity = isWarping ? Math.random() * 15 + 5 : Math.random() * 8 + 2;
                const angle = Math.random() * Math.PI * 2;
                this.vx = Math.cos(angle) * velocity;
                this.vy = Math.sin(angle) * velocity;
                this.friction = 0.95;
                this.gravity = 0.2;
                this.alpha = 1;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, isWarping ? 2 : 3, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.restore();
            }
            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.02;
            }
        }

        function createFirework(x, y) {
            const colors = ['#00f3ff', '#ff00ff', '#bd00ff', '#ffffff', '#ffd700'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const particleCount = isWarping ? 20 : 40; // Less particles per blast during warp for performance
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function animate() {
            // Trail effect: Stronger trail during warp
            ctx.fillStyle = isWarping ? 'rgba(2, 2, 5, 0.4)' : 'rgba(2, 2, 5, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach((p, index) => {
                if (p.alpha > 0) {
                    p.draw();
                    p.update();
                } else {
                    particles.splice(index, 1);
                }
            });

            // Occasional auto-firework when idle
            if(!isWarping && Math.random() < 0.03) {
                createFirework(
                    Math.random() * canvas.width, 
                    Math.random() * (canvas.height * 0.7)
                );
            }

            requestAnimationFrame(animate);
        }
        animate();

    </script>
</body>
</html>
